name: TV APK

on:
  push:
    branches: [tv]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: nightly-1536d25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fetch public prebuilt dependencies
        run: git submodule update --init libs

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Verify official nightly and extract matching ARM32 engine
        run: |
          curl --fail --location --retry 3 https://dl.voiceinput.futo.org/VoiceInput/dev.apk -o "$RUNNER_TEMP/official-nightly.apk"
          echo '12386b029d676ceb8422dcd615dda33288d6a9df2fc77ce902afa4a1afc2bf52  '"$RUNNER_TEMP/official-nightly.apk" | sha256sum --check --strict
          python3 - "$RUNNER_TEMP/official-nightly.apk" <<'PY'
          import pathlib
          import sys
          import zipfile

          destination = pathlib.Path('app/build/tv-native/armeabi-v7a')
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(sys.argv[1]) as apk:
              revision = '1536d25229e1874435b1ada75a2e79d53bc5e4be'
              assert f'revision: "{revision}"' in apk.read('META-INF/version-control-info.textproto').decode()
              for name in ('libvoiceinput.so', 'libtranscribe.so', 'libggml.so', 'libggml-base.so', 'libggml-cpu.so'):
                  (destination / name).write_bytes(apk.read(f'lib/armeabi-v7a/{name}'))
          PY

      - name: Configure persistent TV signing identity
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          test -n "$TV_KEYSTORE_BASE64"
          test -n "$TV_KEYSTORE_PASSWORD"
          mkdir -p build/signing
          printf '%s' "$TV_KEYSTORE_BASE64" | base64 --decode > build/signing/tv.p12
          printf 'storeFile=build/signing/tv.p12\nstorePassword=%s\nkeyAlias=tvvoice\nkeyPassword=%s\n' "$TV_KEYSTORE_PASSWORD" "$TV_KEYSTORE_PASSWORD" > keystore.properties

      - name: Run tests and build separately installable TV APK
        run: ./gradlew --no-daemon --max-workers=2 -PtvPrebuiltNative testDevReleaseUnitTest assembleDevRelease --stacktrace

      - name: Inspect APK identity and architecture
        run: |
          APK=app/build/outputs/apk/dev/release/app-dev-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee build/apk-badging.txt
          grep -F "package: name='org.futo.voiceinput.tv'" build/apk-badging.txt
          grep -Fx "native-code: 'armeabi-v7a'" build/apk-badging.txt
          sha256sum "$APK" > build/apk-sha256.txt

      - name: Upload APK and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-input-tv-arm32-${{ github.run_number }}
          path: |
            app/build/outputs/apk/dev/release/*.apk
            build/apk-badging.txt
            build/apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tv-test-reports-${{ github.run_number }}
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties build/signing/tv.p12
